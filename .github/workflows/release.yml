name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# This job holds the npm publishing identity through OIDC, so every action is pinned to a commit
# SHA: a moved or compromised tag must never be able to publish for this repository. The trailing
# comment records the reviewed release.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        env:
          DSH_RELEASE_MODE: '1'
        run: pnpm run release:check
      - name: Run complete release gates
        env:
          DSH_RELEASE_MODE: '1'
        run: pnpm run check
      - name: Publish to npm with provenance
        run: npm publish --access public --tag latest --provenance
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
